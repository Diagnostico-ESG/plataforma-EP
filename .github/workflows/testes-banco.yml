# Roda a bateria de testes de banco (pgTAP) no GitHub, porque a rede do escritório bloqueia a porta 5432.
# A cadeia de conexão (Session pooler do projeto de desenvolvimento) fica no segredo SUPABASE_DB_URL.
name: Testes de banco

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/testar-banco.mjs'
      - 'scripts/migracoesPendentes.mjs'
      - 'scripts/relatorio-tap.mjs'
      - 'scripts/travaDoProjeto.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/testes-banco.yml'
  workflow_dispatch:

permissions:
  contents: read

# Uma execução por vez: dois testes ao mesmo tempo mexeriam no mesmo banco.
concurrency:
  group: testes-banco
  cancel-in-progress: false

jobs:
  testes-banco:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

<!doctype html>
<!-- Protótipo descartável, proposta 2 (2026-10-30): igual à proposta 1, só com a estrutura da plataforma de hoje (barra azul em cima e faixa de ícones à esquerda). Dados inventados. Visões: #etapas, #meus, #setores, #matriz -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Proposta visual do Quadro v2</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--azul:#3a5afe;--azul-claro:#e8edff;--azul-escuro:#2a44c9;--lateral:#252b36;--lateral-2:#9aa3b2;--fundo:#f3f4f7;--linha:#e3e6ec;--texto:#1d2330;--texto-2:#5f6776;--inativo:#9098a6;
--atraso:#d1293d;--vence:#c2620a;--ok:#16a34a;--mono:'IBM Plex Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0}q{quotes:none}
body{font:13px/1.45 'Source Sans 3',system-ui,sans-serif;color:var(--texto);background:var(--fundo);height:100vh;display:grid;grid-template:52px 56px 1fr/56px 1fr;overflow:hidden}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lateral{grid-row:1/4;background:var(--lateral);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:0 8px 22px}.marca b{background:var(--azul);border-radius:6px;width:30px;height:30px;display:grid;place-items:center;font-size:13px}
.item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:6px;color:var(--lateral-2);font-weight:600;font-size:14px}.item svg{width:18px;height:18px}
.item.ativo{background:rgb(255 255 255/.08);color:#fff}.item.ativo svg{color:#8fa2ff}
.lateral .fim{margin-top:auto}
/* Estrutura de hoje: barra azul em toda a largura e faixa branca de ícones abaixo dela. */
.lateral{grid-row:2/4;background:#fff;border-right:1px solid var(--linha);padding:12px 8px;align-items:center;gap:4px}
.lateral .item{width:40px;height:40px;padding:0;justify-content:center;color:var(--inativo)}.lateral .item svg{width:20px;height:20px}
.lateral .item.ativo{background:var(--azul-claro);color:var(--azul);box-shadow:inset -2px 0 0 var(--azul)}.lateral .item.ativo svg{color:var(--azul)}
.topo{grid-column:1/-1;background:var(--azul);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px 0 0}
.topo .ep{width:56px;text-align:center;font-weight:700;font-size:16px}
.topo h1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}.topo h1 svg{width:18px;height:18px}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:16px;color:#fff}.topo .av.eu{background:#fff}
.av{width:24px;height:24px;border-radius:50%;background:#e9ecf1;color:#4a5163;font:600 10px/24px 'Source Sans 3';text-align:center;flex:none}.av.eu{background:var(--azul-claro);color:var(--azul-escuro)}.av.g{width:32px;height:32px;line-height:32px;font-size:12px}
.barra{background:#fff;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:10px;padding:0 24px}
.btn{border:1px solid var(--linha);background:#fff;font:600 13px 'Source Sans 3';color:var(--texto);height:34px;padding:0 12px;border-radius:6px;display:inline-flex;align-items:center;gap:8px}
.btn.prim{background:var(--azul);border-color:var(--azul);color:#fff}.btn.leve{border-color:transparent;color:var(--texto-2)}.btn.on{background:var(--azul-claro);border-color:transparent;color:var(--azul-escuro)}
.btn em{font:500 11px var(--mono);font-style:normal;background:var(--azul-claro);color:var(--azul-escuro);border-radius:999px;padding:0 6px}
.sep{width:1px;height:22px;background:var(--linha)}
.legenda{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--texto-2)}.legenda span{display:inline-flex;align-items:center;gap:5px}
.area{overflow:hidden;padding:18px 24px;display:flex;gap:14px;align-items:flex-start}
.col{width:286px;flex:none}
.cab{display:flex;align-items:center;gap:8px;padding:0 2px 4px}.cab .nome-col{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--linha);border-radius:6px;padding:4px 10px;font-weight:700;font-size:14px}
.cab .nome-col svg{color:var(--texto-2)}.cab .n{font:500 12px var(--mono);color:var(--texto-2)}.cab .acoes{margin-left:auto;display:flex;gap:4px;color:var(--inativo)}
.desc{font-size:12px;color:var(--inativo);padding:0 4px 10px}
.cartao{background:#fff;border:1px solid var(--linha);border-radius:8px;padding:12px 14px;margin-bottom:10px;display:grid;gap:8px}
.cartao.outro{opacity:.38}.cartao.feito{opacity:.55}
.l1{display:flex;align-items:center;gap:8px}.l1 .st{margin-left:auto}
.setor{font:700 11px 'Source Sans 3';letter-spacing:.3px;color:#fff;border-radius:4px;padding:1px 7px}
.titulo{font-size:15px;font-weight:600;line-height:1.3}
.campo{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--texto)}.campo svg{color:var(--inativo)}
.pe{display:flex;align-items:center;gap:14px;font:500 12px var(--mono);color:var(--texto-2);border-top:1px solid #f0f2f5;padding-top:8px}.pe span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.fechada svg{transform:rotate(-90deg)}.pe svg{width:14px;height:14px}
.pe .atraso{color:var(--atraso)}.pe .vence{color:var(--vence)}.pe .av{margin-left:auto}
.st svg{width:18px;height:18px}
.trilha{display:flex;gap:3px}.trilha i{flex:1;height:4px;border-radius:2px;background:#e3e6ec}.trilha i.f{background:#6b7a99}.trilha i.a{background:var(--azul)}
.cabset{background:#fff;border:1px solid var(--linha);border-radius:8px;padding:10px 12px;margin-bottom:12px;display:grid;gap:4px}
.cabset .l{display:flex;align-items:center;gap:8px}.cabset .nm{font-size:13px;color:var(--texto-2)}.cabset .n{margin-left:auto;font:500 12px var(--mono);color:var(--texto-2)}
.matriz{overflow:hidden;padding:18px 24px}
.grade{display:grid;grid-template-columns:196px repeat(4,262px);background:#fff;border:1px solid var(--linha);border-radius:8px;overflow:hidden;width:max-content}
.grade>div{border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);padding:8px}
.gh{background:#fafbfc;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}.gh svg{color:var(--texto-2)}.gh small{font:500 11px var(--mono);color:var(--texto-2)}
.rs{background:#fafbfc}.rs .l{display:flex;align-items:center;gap:6px}.rs .nm{font-size:12px;color:var(--texto-2);margin-top:4px}.rs .n{margin-left:auto;font:500 11px var(--mono);color:var(--texto-2)}
.mini{border:1px solid var(--linha);border-radius:6px;padding:8px 10px;margin-bottom:6px;display:grid;gap:6px}.mini .titulo{font-size:13px}.mini .pe{padding-top:6px}
.fechada{grid-column:1/-1;background:#fafbfc;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--texto-2)}
</style>
</head>
<body>
<svg style="display:none">
<symbol id="quadro" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></symbol>
<symbol id="lista" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
<symbol id="predio" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/></symbol>
<symbol id="grafico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
<symbol id="ajustes" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
<symbol id="ajuda" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></symbol>
<symbol id="filtro" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></symbol>
<symbol id="pessoa" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
<symbol id="relogio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="clipe" viewBox="0 0 24 24"><path d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7L10.2 17.7a1.7 1.7 0 0 1-2.4-2.4L15.5 7.6"/></symbol>
<symbol id="mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="pontos" viewBox="0 0 24 24"><circle cx="12" cy="5" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="12" cy="19" r=".8"/></symbol>
<symbol id="seta" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="sino" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
<symbol id="busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
<symbol id="e0" viewBox="0 0 24 24"><path d="M3 13l2.5-7.5A2 2 0 0 1 7.4 4h9.2a2 2 0 0 1 1.9 1.5L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></symbol>
<symbol id="e1" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
<symbol id="e2" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="e3" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8.5 11l2 2 3.5-3.5"/></symbol>
<symbol id="e4" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></symbol>
<symbol id="e5" viewBox="0 0 24 24"><path d="M12 3l2.4 1.8 3-.2.9 2.9 2.5 1.7-1 2.8 1 2.8-2.5 1.7-.9 2.9-3-.2L12 21l-2.4-1.8-3 .2-.9-2.9L3.2 14.8l1-2.8-1-2.8 2.5-1.7.9-2.9 3 .2z"/><path d="M8.5 12l2.3 2.3 4.7-4.6"/></symbol>
</svg>
<header class="topo"><span class="ep">EP</span><h1><svg class="i"><use href="#quadro"/></svg>Processos</h1>
 <div class="dir"><svg class="i"><use href="#busca"/></svg><svg class="i"><use href="#sino"/></svg><span class="av eu g">AL</span></div></header>
<aside class="lateral">
 <div class="item ativo" title="Processos"><svg class="i"><use href="#quadro"/></svg></div>
 <div class="item" title="Setores"><svg class="i"><use href="#predio"/></svg></div>
 <div class="item" title="Painel"><svg class="i"><use href="#grafico"/></svg></div>
 <div class="item" title="Administração"><svg class="i"><use href="#ajustes"/></svg></div>
 <div class="item fim" title="Ajuda"><svg class="i"><use href="#ajuda"/></svg></div>
</aside>
<div class="barra" id="barra"></div>
<main id="area"></main>
<script>
const ETAPAS=[['Não iniciados','Aguardando o primeiro contato com o setor'],['Modelagem piloto','Primeiro desenho do fluxo com o setor'],['Relatório e modelagem técnica','Fluxograma final e relatório'],['Revisão interna','Conferência por outro integrante do EP'],['Validação com o setor','Rodadas de ajuste com o setor'],['Aprovação pelo setor','Assinatura e E-protocolo']]
// Paleta viva só para os selos de setor: sem vermelho, âmbar, verde e azul, que dizem prazo e situação.
const SETORES={SGA:['Secretaria de Gestão Administrativa','#7c3aed'],CDI:['Coordenadoria de Documentação e Informação','#0891b2'],OUV:['Ouvidoria Geral','#db2777'],
PLN:['Diretoria de Planejamento','#9333ea'],JUR:['Assessoria Jurídica','#4f46e5'],TEC:['Diretoria de Tecnologia','#0f766e'],COM:['Assessoria de Comunicação','#c026d3']}
const PESSOAS={AL:'Ana Lima',BR:'Bruno Reis',CN:'Carla Nunes'}
// [nome, setor, etapa, situação, responsável, versão, dias na etapa, prazo, anexos]
const P=[['Solicitação de diárias e passagens','SGA',0,'a','',null,4],['Protocolo de correspondências recebidas','CDI',0,'a','BR',null,9],['Atendimento de manifestações do cidadão','OUV',0,'a','',null,2],
['Elaboração do plano anual de compras','PLN',1,'i','AL','V1',6,null,2],['Contratação de estagiários','SGA',1,'a','CN',null,1],
['Emissão de pareceres jurídicos','JUR',2,'a','AL','V1',3,null,1],['Gestão de acessos aos sistemas','TEC',2,'i','AL','V2',15,['atraso','27/10 · há 3 dias'],4],
['Publicação de atos no diário oficial','CDI',2,'a','BR','V1',5],['Arquivamento de processos encerrados','CDI',2,'i','AL','V3',8,null,3],
['Divulgação de campanhas institucionais','COM',3,'f','AL','V4',2,null,5],['Controle de bens patrimoniais','SGA',3,'i','CN','V2',11],
['Monitoramento de indicadores','PLN',4,'a','BR','V4F',3,['vence','01/11 · em 2 dias'],2],['Revisão de contratos de serviços','JUR',5,'i','CN','V5',7,null,6]]
const ROT={a:'A fazer',i:'Iniciado',f:'Finalizado'}
const ST={a:'<circle cx="12" cy="12" r="8" fill="none" stroke="#9098a6" stroke-width="2"/>',
i:'<circle cx="12" cy="12" r="8" fill="none" stroke="#3a5afe" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="#3a5afe"/>',
f:'<circle cx="12" cy="12" r="9" fill="#16a34a"/><path d="M8 12.2l2.8 2.8 5.2-5.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'}
const ic=(n,c='')=>`<svg class="i ${c}"><use href="#${n}"/></svg>`
const st=s=>`<span class="st" title="${ROT[s]}" aria-label="Situação: ${ROT[s]}"><svg viewBox="0 0 24 24">${ST[s]}</svg></span>`
const selo=s=>`<span class="setor" style="background:${SETORES[s][1]}" title="${SETORES[s][0]}">${s}</span>`
const av=r=>r?`<span class="av ${r==='AL'?'eu':''}" title="${PESSOAS[r]}">${r}</span>`:''
const visao=location.hash.slice(1)||'etapas'
function pe(p,semAvatar){const[, , , , r,v,d,pz,an]=p
 return `<div class="pe"><span title="Dias na etapa">${ic('relogio')}${d}d</span>${pz?`<span class="${pz[0]}" title="Prazo">${ic('cal')}${pz[1]}</span>`:''}${an?`<span title="Arquivos">${ic('clipe')}${an}</span>`:''}${semAvatar?'':av(r)}</div>`}
function cartao(p,meus){const[n,s,e,sit,r,v]=p
 return `<div class="cartao ${meus&&r!=='AL'?'outro':''}"><div class="l1">${selo(s)}${st(sit)}</div><div class="titulo">${n}</div>
 ${r?`<div class="campo">${ic('pessoa')}${r==='AL'?'Você':PESSOAS[r]}</div>`:`<div class="campo" style="color:var(--inativo)">${ic('pessoa')}Sem responsável</div>`}
 ${v?`<div class="campo">${ic('doc')}Versão <b class="mono" style="font:500 12px var(--mono)">${v}</b></div>`:''}${pe(p,true)}</div>`}
const trilha=e=>`<div class="trilha" title="Etapa ${e+1} de 8">${Array.from({length:8},(_,k)=>`<i class="${k<e?'f':k===e?'a':''}"></i>`).join('')}</div>`
function cartaoDoSetor(p){const[n,s,e,sit]=p
 return `<div class="cartao"><div class="l1"><span class="campo" style="font-weight:600">${ic('e'+Math.min(e,5))}${ETAPAS[e][0]}</span>${st(sit)}</div><div class="titulo">${n}</div>${trilha(e)}${pe(p)}</div>`}
function barra(){const vis={etapas:'Quadro por etapa',meus:'Quadro por etapa',setores:'Quadro por setor',matriz:'Quadro por etapa e setor'}[visao]
 document.getElementById('barra').innerHTML=`<button class="btn prim">${ic('mais')}Cadastrar processo</button>
 <button class="btn">${ic('quadro')}${vis}${ic('seta')}</button><span class="sep"></span>
 <button class="btn leve">${ic('filtro')}Filtros${visao==='meus'?'':' <em>1</em>'}</button>
 <button class="btn ${visao==='meus'?'on':'leve'}">${ic('pessoa')}Destacar os meus</button>
 <span class="legenda">${['a','i','f'].map(s=>`<span><svg viewBox="0 0 24 24" width="14" height="14">${ST[s]}</svg>${ROT[s]}</span>`).join('')}</span>`}
function quadroPorEtapa(meus){return ETAPAS.map(([e,d],i)=>{const ps=P.filter(p=>p[2]===i)
 return `<section class="col"><div class="cab"><span class="nome-col">${ic('e'+i)}${e}</span><span class="n">${ps.length}</span><span class="acoes">${i===0?ic('mais'):''}${ic('pontos')}</span></div>
 <div class="desc">${d}</div>${ps.map(p=>cartao(p,meus)).join('')}</section>`}).join('')}
function quadroPorSetor(){return Object.entries(SETORES).map(([s,[nm]])=>{const ps=P.filter(p=>p[1]===s)
 return `<section class="col"><div class="cabset"><div class="l">${selo(s)}<span class="n">${ps.length}</span></div><div class="nm">${nm}</div></div>${ps.map(cartaoDoSetor).join('')}</section>`}).join('')}
function matriz(){const cols=ETAPAS.slice(0,4);let h=`<div class="gh">${ic('predio')}Setor</div>`+cols.map(([e],i)=>`<div class="gh">${ic('e'+i)}${e}<small>${P.filter(p=>p[2]===i).length}</small></div>`).join('')
 Object.entries(SETORES).forEach(([s,[nm]],k)=>{const ps=P.filter(p=>p[1]===s&&p[2]<4)
  if(k>=5){h+=`<div class="fechada">${ic('seta')}${selo(s)}${nm} · recolhido · ${ps.length} processo${ps.length===1?'':'s'}</div>`;return}
  h+=`<div class="rs"><div class="l">${ic('seta')}${selo(s)}<span class="n">${ps.length}</span></div><div class="nm">${nm}</div></div>`
  h+=cols.map((e,i)=>`<div>${ps.filter(p=>p[2]===i).map(p=>`<div class="mini"><div class="l1"><span class="titulo">${p[0]}</span>${st(p[3])}</div>${pe(p)}</div>`).join('')}</div>`).join('')})
 return `<div class="grade">${h}</div>`}
barra()
const area=document.getElementById('area');area.className=visao==='matriz'?'matriz':'area'
area.innerHTML=visao==='setores'?quadroPorSetor():visao==='matriz'?matriz():quadroPorEtapa(visao==='meus')
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prévia da capa de entrada</title>
<!-- Prévia estática para aprovação (não é código da aplicação). Usa os tokens reais; ?v=b mostra a variante só com ícones. -->
<link rel="stylesheet" href="../../src/styles/tokens.css">
<style>
  @font-face { font-family: 'Source Sans 3'; src: url('../../public/fonts/source-sans-3-latin.woff2') format('woff2'); font-weight: 400 700; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('../../public/fonts/ibm-plex-mono-500-latin.woff2') format('woff2'); font-weight: 500; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: var(--fonte); font-size: var(--tam-base); color: var(--texto); background: var(--folha); }

  .capa { display: grid; grid-template-columns: minmax(380px, 34%) 1fr; height: 100vh; }

  /* Coluna do login */
  .login { display: flex; flex-direction: column; justify-content: center; gap: var(--esp-5); padding: 0 64px; }
  .marca { display: grid; place-items: center; width: 56px; height: 56px; border-radius: var(--canto); background: var(--azul); color: #fff; font-size: 20px; font-weight: 700; letter-spacing: .02em; }
  .orgao { margin-bottom: var(--esp-2); font-size: var(--tam-rotulo); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-2); }
  .titulo { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.01em; }
  .frase { margin-top: var(--esp-3); font-size: 17px; line-height: 1.45; color: var(--texto-2); max-width: 34ch; text-wrap: pretty; }
  .botao { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px; border: 0; border-radius: var(--canto-botao); background: var(--azul); color: #fff; font: 600 15px var(--fonte); }
  .botao svg { width: 18px; height: 18px; }
  .rodape { position: absolute; bottom: 32px; left: 64px; font-size: var(--tam-rotulo); color: var(--texto-2); }

  /* Ilustração */
  .arte { position: relative; overflow: hidden; background: var(--grafite);
          background-image: radial-gradient(circle at 70% 30%, rgb(58 90 254 / 18%), transparent 55%),
                            radial-gradient(rgb(255 255 255 / 6%) 1px, transparent 1px);
          background-size: auto, 22px 22px; }
  .fluxo { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fluxo .forma { fill: none; stroke: rgb(255 255 255 / 16%); stroke-width: 1.5; }
  .fluxo .seta { fill: none; stroke: rgb(255 255 255 / 16%); stroke-width: 1.5; marker-end: url(#ponta); }
  .fluxo .acesa { fill: none; stroke: var(--azul); stroke-width: 2.5; stroke-dasharray: 6 7; marker-end: url(#ponta-azul); }

  .quadro { position: absolute; top: 250px; left: 70px; display: flex; gap: 14px;
            transform: perspective(1800px) rotateX(12deg) rotateY(-10deg) rotateZ(-4deg) scale(.92); transform-origin: 0 0; }
  .coluna { width: 152px; padding: 10px; border-radius: 10px; background: rgb(255 255 255 / 6%); display: flex; flex-direction: column; gap: 10px; }
  .cabeca { display: flex; align-items: center; gap: 7px; padding: 7px 9px; border-radius: 6px; background: rgb(255 255 255 / 10%); color: #dfe3ea; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cabeca svg { flex: none; width: 16px; height: 16px; }
  /* Variante C: o mesmo quadro, sem perspectiva nem giro */
  .reto .quadro { transform: none; }
  /* Variante D: de frente, com relevo. Colunas afundadas como bandejas; cartões com espessura e sombra, luz de cima. */
  .relevo .quadro { transform: none; }
  .relevo .coluna { background: rgb(0 0 0 / 22%); box-shadow: inset 0 3px 8px rgb(0 0 0 / 45%), 0 1px 0 rgb(255 255 255 / 8%); }
  .relevo .cabeca { background: #3a4252; box-shadow: inset 0 1px 0 rgb(255 255 255 / 12%), 1px 1px 0 #2c3340, 2px 2px 0 #262c38, 3px 3px 0 #20252f, 4px 4px 0 #1b2029, 10px 12px 16px rgb(0 0 0 / 40%); }
  .relevo .cartao { box-shadow: 1px 1px 0 #d4d9e2, 2px 2px 0 #c9cfd9, 3px 3px 0 #bec5d0, 4px 4px 0 #b3bbc7, 5px 5px 0 #a8b0be, 6px 6px 0 #9da6b5, 7px 7px 0 #929cac, 18px 22px 26px rgb(0 0 0 / 55%); }
  .relevo .cartao.ativo { outline: none; transform: translate(-5px, -5px);
    box-shadow: 0 0 0 2px var(--azul), 2px 2px 0 2px #c9cfd9, 4px 4px 0 2px #b3bbc7, 6px 6px 0 2px #9da6b5, 9px 9px 0 2px #8892a3, 12px 12px 0 2px #7c8798, 30px 36px 40px rgb(0 0 0 / 60%), 0 0 44px rgb(58 90 254 / 40%); }
  .relevo .selo, .relevo .pilula { box-shadow: inset 0 -2px 0 rgb(0 0 0 / 18%); }
  /* Variante E: o relevo da D com um giro leve (bem menor que o da B) */
  .relevo.giro-leve .quadro { transform: perspective(2000px) rotateX(7deg) rotateY(-6deg) rotateZ(-2deg); }
  .so-icones .cabeca { justify-content: center; }
  .so-icones .cabeca span { display: none; }
  .so-icones .cabeca svg { width: 20px; height: 20px; }

  .cartao { padding: 10px; border-radius: 8px; background: #fff; display: grid; gap: 8px; box-shadow: 0 6px 16px rgb(0 0 0 / 25%); }
  .cartao.ativo { outline: 2px solid var(--azul); outline-offset: 2px; }
  .linha1 { display: flex; justify-content: space-between; align-items: center; }
  .selo { width: 34px; height: 14px; border-radius: 4px; background: var(--selo-do-setor, #5b6b86); }
  .status { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--texto); }
  .status.meio { background: linear-gradient(90deg, var(--texto) 50%, transparent 50%); }
  .status.cheio { background: var(--texto); }
  .barra { height: 7px; border-radius: 4px; background: #d9dde5; }
  .barra.curta { width: 62%; }
  .rodape-cartao { display: flex; align-items: center; gap: 6px; padding-top: 7px; border-top: 1px solid var(--linha-leve); }
  .avatar { width: 16px; height: 16px; border-radius: 50%; background: var(--avatar-fundo); }
  .avatar.eu { background: var(--azul-claro); box-shadow: inset 0 0 0 2px var(--azul); }
  .pilula { height: 10px; width: 26px; border-radius: 6px; background: var(--linha); }
  .pilula.atraso { background: var(--atraso); }
  .pilula.vence { background: var(--vence); }
  .pilula.ok { background: #2f9e74; }
  .pilula.info { background: var(--azul); }
  .espaco { flex: 1; }
</style>
</head>
<body>
<main class="capa">
  <section class="login">
    <span class="marca">EP</span>
    <div>
      <p class="orgao">Centro Estadual de Desburocratização (CED)</p>
      <h1 class="titulo">Escritório de<br>Processos</h1>
      <p class="frase">Gestão das tarefas e dos documentos do mapeamento de processos da Casa Civil do Paraná.</p>
    </div>
    <button class="botao">Entrar com a conta institucional</button>
  </section>

  <section class="arte" aria-hidden="true">
    <svg class="fluxo" viewBox="0 0 960 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="rgb(255 255 255 / 30%)"/></marker>
        <marker id="ponta-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3a5afe"/></marker>
      </defs>
      <!-- Fluxograma ao fundo: início, tarefas, decisão e fim, como num BPMN -->
      <circle class="forma" cx="70" cy="70" r="20"/>
      <path class="seta" d="M90 70H170"/>
      <rect class="forma" x="172" y="44" width="130" height="52" rx="10"/>
      <path class="seta" d="M302 70H380"/>
      <path class="forma" d="M420 34L456 70L420 106L384 70Z"/>
      <path class="seta" d="M456 70H540"/>
      <rect class="forma" x="542" y="44" width="130" height="52" rx="10"/>
      <path class="seta" d="M420 106V170H600"/>
      <path class="seta" d="M672 70H780"/>
      <circle class="forma" cx="804" cy="70" r="22" stroke-width="4"/>
      <rect class="forma" x="602" y="770" width="150" height="56" rx="10"/>
      <path class="forma" d="M820 760L856 796L820 832L784 796Z"/>
      <path class="seta" d="M752 798H782"/>
      <path class="seta" d="M856 796H930"/>
      <circle class="forma" cx="70" cy="830" r="20"/>
      <path class="seta" d="M90 830H600"/>
      <!-- Caminho aceso: o processo atravessando o quadro -->
      <path class="acesa" d="M20 600C220 510 330 700 500 620S760 500 950 580"/>
    </svg>
    <div class="quadro" id="quadro"></div>
  </section>
</main>

<script>
  // Etapas reais do catálogo, com os ícones da aplicação (src/components/Icone.tsx).
  const ETAPAS = [
    ['Não iniciados', '<path d="M3 13l2.5-7.5A2 2 0 0 1 7.4 4h9.2a2 2 0 0 1 1.9 1.5L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/>'],
    ['Modelagem piloto', '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'],
    ['Relatório e modelagem técnica', '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'],
    ['Revisão interna', '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8.5 11l2 2 3.5-3.5"/>'],
    ['Validação com o setor', '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>'],
    ['Aprovação pelo setor', '<path d="M12 3l2.4 1.8 3-.2.9 2.9 2.5 1.7-1 2.8 1 2.8-2.5 1.7-.9 2.9-3-.2L12 21l-2.4-1.8-3 .2-.9-2.9L3.2 14.8l1-2.8-1-2.8 2.5-1.7.9-2.9 3 .2z"/><path d="M8.5 12l2.3 2.3 4.7-4.6"/>'],
    ['Publicação', '<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>'],
    ['Concluídos', '<circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.8 2.8 5.2-5.4"/>'],
  ]
  // Cartões "mudos": [status, pílula, avatar é o meu?, cartão em destaque?]
  const CARTOES = [
    [['', '', 0], ['', '', 0], ['', '', 0]],
    [['meio', 'vence', 1, 1], ['', '', 0]],
    [['meio', '', 0], ['cheio', 'atraso', 0], ['', '', 0]],
    [['meio', 'info', 0]],
    [['', '', 1], ['meio', 'vence', 0]],
    [['meio', '', 0]],
    [['cheio', 'ok', 0], ['meio', '', 0]],
    [['cheio', 'ok', 0], ['cheio', 'ok', 0], ['cheio', 'ok', 0]],
  ]
  const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`
  const cartao = ([status, pilula, eu, ativo]) => `
    <div class="cartao${ativo ? ' ativo' : ''}">
      <div class="linha1"><span class="selo"></span><span class="status ${status}"></span></div>
      <div class="barra"></div><div class="barra curta"></div>
      <div class="rodape-cartao"><span class="avatar${eu ? ' eu' : ''}"></span><span class="espaco"></span><span class="pilula ${pilula}"></span></div>
    </div>`
  document.getElementById('quadro').innerHTML = ETAPAS.map(([nome, d], i) =>
    `<div class="coluna"><div class="cabeca">${svg(d)}<span>${nome}</span></div>${CARTOES[i].map(cartao).join('')}</div>`).join('')
  if (location.search.includes('v=b')) document.body.classList.add('so-icones')
  if (location.search.includes('v=c')) document.body.classList.add('reto')
  if (location.search.includes('v=d')) document.body.classList.add('relevo', 'so-icones')
  if (location.search.includes('v=e')) document.body.classList.add('relevo', 'so-icones', 'giro-leve')
</script>
</body>
</html>
